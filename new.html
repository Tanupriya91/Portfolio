<!DOCTYPE html>
<html>
<head>
  <title>WAY TO DREAM</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-image: url('go.jpg'); /* Replace with your actual image */
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #d7c664;
      padding: 30px;
    }

    h2 {
      text-align: center;
      font-size: 36px;
      color: #f8f9fa;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      margin-bottom: 30px;
    }

    table {
      width: 80%;
      margin: 0 auto;
      border-collapse: collapse;
      background-color: rgba(0, 0, 0, 0.5);
      border: 2px solid #ffffff;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
    }

    th, td {
      border: 1px solid #ffffff;
      padding: 12px 20px;
      text-align: center;
      font-size: 18px;
    }

    th {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffd700;
    }

    td {
      background-color: rgba(255, 255, 255, 0.1);
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.2);
      transition: 0.3s;
    }
  </style>
</head>
<body>

  

  <table>
    <tr>
      <th>Date</th>
      <th>Topics</th>
      <th>Revision</th>
    </tr>
    <tr>
      <td>28-7-2025</td>
      <td>Linked List</td>
      <td>Array</td>
    </tr>
    <tr>
      <td>29-7-2025</td>
      <td>Stack</td>
      <td>String</td>
    </tr>
  </table>

</body>
</html>
