<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stylish Calculator</title>
  <style>
    /* Reset and base */
    * {
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .calculator {
      background: #1e1e2f;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      width: 320px;
    }

    #display {
      width: 100%;
      height: 60px;
      border-radius: 15px;
      border: none;
      padding: 0 20px;
      font-size: 2.2rem;
      background: #292946;
      color: #f8f8f2;
      text-align: right;
      margin-bottom: 25px;
      box-shadow: inset 0 0 8px #3b3b5c;
      user-select: none;
      letter-spacing: 2px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    button {
      padding: 18px 0;
      font-size: 1.4rem;
      font-weight: 600;
      border-radius: 15px;
      border: none;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      color: #f8f8f2;
      background: linear-gradient(145deg, #3c3c60, #282849);
      user-select: none;
    }
    button:active {
      transform: scale(0.95);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* Special colors for operator buttons */
    button.operator {
      background: linear-gradient(145deg, #f67280, #c4555a);
      box-shadow: 0 6px 15px rgba(196, 85, 90, 0.6);
      color: #fff;
    }
    button.operator:active {
      box-shadow: 0 4px 10px rgba(196, 85, 90, 0.8);
    }

    /* Clear button style */
    button.clear {
      background: linear-gradient(145deg, #ff9a9e, #ff6a6e);
      box-shadow: 0 6px 15px rgba(255, 106, 110, 0.6);
      color: #fff;
      font-weight: 700;
    }
    button.clear:active {
      box-shadow: 0 4px 10px rgba(255, 106, 110, 0.8);
    }

    /* Equals button style */
    button.equals {
      grid-column: span 1;
      background: linear-gradient(145deg, #4caf50, #357a38);
      box-shadow: 0 6px 15px rgba(53, 122, 56, 0.7);
      color: #fff;
      font-weight: 700;
    }
    button.equals:active {
      box-shadow: 0 4px 10px rgba(53, 122, 56, 0.9);
    }

  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled placeholder="0" />
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="appendValue('/')">/</button>
      <button class="operator" onclick="appendValue('*')">*</button>
      <button class="operator" onclick="appendValue('-')">-</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="equals" onclick="calculate()">=</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('0')">0</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      if (display.value === '0' || display.value === 'Error') {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function clearDisplay() {
      display.value = '';
    }

    function calculate() {
      try {
        // Prevent eval on empty or invalid strings
        if(display.value.trim() === '') return;
        let result = eval(display.value);
        display.value = Number.isFinite(result) ? result : 'Error';
      } catch {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
